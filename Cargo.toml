[package]
name = "hats-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Konstantin Malanchev"]

[profile.release]
strip = true
lto = "thin"

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
# Keep in sync with object_store
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytesize = { version = "2", features = ["serde"] }
datafusion ={ version = "55", default-features = false, features = ["parquet", "compression", "recursive_protection", "sql"] }
futures = "0.3"
html-escape = "0.2"
http = "1"
ipnet = "2"
# Keep in sync with datafusion
object_store = "0.13"
object_store_opendal = "0.58"
opendal = { version = "0.58", default-features = false, features = ["services-s3", "services-gcs", "services-azblob", "services-http", "http-transport-reqwest", "executors-tokio", "layers-retry"] }
# `network` builds the HTTP client itself, to put its own DNS resolver in it, so it
# needs both the transport adapter and reqwest by name. Both versions must match what
# `opendal` resolves to: a `reqwest::Client` from another copy is a different type.
opendal-http-transport-reqwest = "0.58.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
secrecy = { version = "0.10.3", features = ["serde"] }
tempfile = "3"
tld = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["fs", "trace"] }
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

# Package-wide, so `tests/` gets these too. The lints that only suit the service —
# no `unwrap` in a request path — are crate attributes in `src/lib.rs`.
[lints.rust]
missing_debug_implementations = "warn"
# `deny`, not `forbid`: one test sets `AWS_*` env vars to prove the service ignores it.
unsafe_code = "deny"
unused_must_use = "deny"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
needless_pass_by_value = "warn"
print_stdout = "warn"
redundant_clone = "warn"
todo = "warn"

[dev-dependencies]
http-body-util = "0.1"
hyper-util = "0.1"
s3s = "0.15"
s3s-fs = "0.15"
tower ={ version = "0.5", features = ["util"] }
