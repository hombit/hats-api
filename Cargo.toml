[package]
name = "hats-api"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Konstantin Malanchev"]

[profile.release]
strip = true
lto = "thin"

[dependencies]
async-trait = "0.1"
axum = "0.8"
# WebDAV authenticates with Basic, which is a base64 of the caller's two options.
base64 = "0.23"
bytes = "1"
# The HEALPix tesselation itself. Keep in sync with what `moc` resolves to.
cdshealpix = "0.9.1"
# Keep in sync with object_store
chrono = { version = "0.4", default-features = false, features = ["std"] }
bytesize = { version = "2", features = ["serde"] }
# A catalog's partition_info.csv is a CSV, not a column of numbers.
csv = "1"
datafusion ={ version = "55", default-features = false, features = ["parquet", "compression", "recursive_protection", "sql"] }
# The UTF-8 label `java-properties` takes and does not re-export. Same 0.8 as it resolves
# to, so one copy: an `Encoding` from another would be a different type.
encoding_rs = "0.8"
futures = "0.3"
# Compiles the whole list of data-file patterns into one matcher.
globset = "0.4"
html-escape = "0.2"
http = "1"
ipnet = "2"
# A catalog's properties file is a Java properties file; escapes and continuations too.
java-properties = "2"
# Multi-Order Coverage maps: the covering of a region, and the set algebra over it.
moc = "0.19.2"
# Keep in sync with datafusion
object_store = "0.13"
object_store_opendal = "0.58"
opendal = { version = "0.58", default-features = false, features = ["services-s3", "services-gcs", "services-azblob", "services-http", "services-webdav", "http-transport-reqwest", "executors-tokio", "layers-retry"] }
# `network` builds the HTTP client itself, to put its own DNS resolver in it, so it
# needs both the transport adapter and reqwest by name. Both versions must match what
# `opendal` resolves to: a `reqwest::Client` from another copy is a different type.
opendal-http-transport-reqwest = "0.58.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
secrecy = { version = "0.10.3", features = ["serde"] }
tempfile = "3"
tld = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.9"
tower-http = { version = "0.7", features = ["compression-br", "compression-gzip", "compression-zstd", "fs", "trace"] }
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
# The OpenAPI document, derived from the same serde types the routes deserialize.
utoipa = { version = "5", features = ["preserve_order"] }

# Package-wide, so `tests/` gets these too. The lints that only suit the service —
# no `unwrap` in a request path — are crate attributes in `src/lib.rs`.
[lints.rust]
missing_debug_implementations = "warn"
# `deny`, not `forbid`: one test sets `AWS_*` env vars to prove the service ignores it.
unsafe_code = "deny"
unused_must_use = "deny"
unused_qualifications = "warn"

[lints.clippy]
dbg_macro = "warn"
needless_pass_by_value = "warn"
print_stdout = "warn"
redundant_clone = "warn"
todo = "warn"

[dev-dependencies]
http-body-util = "0.1"
hyper-util = "0.1"
s3s = "0.15"
s3s-fs = "0.15"
tower ={ version = "0.5", features = ["util"] }
