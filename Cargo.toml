[package]
name = "hats-api"
version = "0.1.0"
edition = "2024"

[profile.release]
strip = true
lto = "thin"

[dependencies]
axum = "0.8"
bytes = "1"
datafusion = { version = "55", default-features = false, features = ["parquet", "compression", "recursive_protection"] }
# version consisten with datafusion
object_store = { version = "0.13", features = ["aws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
