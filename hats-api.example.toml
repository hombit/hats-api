# Every key is optional and every value shown is the default. An unknown key is a
# startup error.
#
#   hats-api --config hats-api.toml
#   HATS_API_CONFIG=hats-api.toml hats-api

[server]
# Every interface; use "127.0.0.1" to listen locally only.
address = "0.0.0.0"
port = 80
# Sign what this service answers — the Server header, and the foot of a generated
# directory page — the way apache and nginx do. Off publishes neither.
show_version = true
# Serve a directory's own index.html in place of a generated listing. Off publishes the
# generated page everywhere, and the file still answers to its own name.
serve_mounted_index_html = true
# Serve a mounted robots.txt in place of the generated default. Off always uses the
# default: Disallow: / for everything, Allow for the API's docs, health and openapi.json.
serve_mounted_robots_txt = true
# Who runs this deployment, written wherever the service identifies itself.
# contact = "ops@example.org"
# true sends "hats-api/x.y.z (ops@example.org)"; a string as written; false no header.
user_agent = true

[api]
# API mode: the caller names the data in the request, and [api.access] decides what it
# may name. Off serves nothing but the mounts that set `serve`.
enabled = true
# The url subtree the API answers under. It wins over a mount covering the same paths.
prefix = "/api/v1"

[api.access.network]
# Which addresses a request may reach, whatever backend it goes through. A name is
# judged before it is resolved, and every address it resolves to is judged again inside
# the HTTP client's own resolver.

# 127.0.0.0/8, ::1, localhost.
allow_loopback = false
# RFC1918, unique-local, and link-local — cloud instance metadata.
allow_private = false
# Names that only mean something inside a network. A name must end in a TLD IANA has
# delegated; .internal, .local, .lan and single-label names are refused.
allow_local_names = false
# Allowed whatever the three switches say. A host named here is allowed along with
# whatever it resolves to.
# allow_cidrs = ["10.1.2.0/24"]
# allow_hosts = ["minio.internal"]

# Each [api.access.<backend>] below has three states: no `endpoints` key for any
# endpoint (the default, still subject to [api.access.network]), an empty list to turn
# the scheme off, or a list for exactly those. Naming an endpoint is permission on its
# own — [api.access.network] is not consulted for it. Any bucket at an allowed endpoint
# is readable.

[api.access.s3]
# "aws" is S3 itself — a url with no `endpoint` option. Anything else is a url.
# endpoints = ["aws", "https://minio.example.com"]

[api.access.gcs]
# "gcp" is Google Cloud Storage itself.
# endpoints = ["gcp"]

[api.access.azure]
# "azure" is Azure Blob Storage itself; a named endpoint is Azurite or a compatible.
# endpoints = ["azure"]

[api.access.http]
# For http:// and https:// urls. Every entry is a url; there is no provider name here.
# endpoints = ["https://data.example.com"]

# Whether an http:// url may be read when no endpoint list names one. A request carrying
# a credential also needs its own `allow_http` option. Naming an http:// server in
# `endpoints` does not need this as well.
allow_plain_http = false

[api.access.webdav]
# For webdav:// urls, written with the transport underneath rather than "webdav://". A
# request picks the transport with a `transport` option, "https" (the default) or
# "http"; there is no allow_plain_http here, so cleartext WebDAV is reached only by
# naming the "http://" server.
# endpoints = ["https://dav.example.com"]

[api.access.hf]
# "hf" is the Hugging Face Hub itself — a url with no `endpoint` option. A named endpoint
# is a private Hub.
# endpoints = ["hf"]

# There is no [api.access] section for local files, and none for a mount's own source: a
# [[mount]] is what makes a directory readable, and naming one is the permission. The
# sections above are about where a *caller* may point this service.

# Zero or more mounts, each naming one directory. `path` and `source` are required, and
# two mounts may not claim the same subtree, served or not.
#
# `path` is the address in both modes. The file server publishes the directory there, and
# an API request names a file in it by the same path: file:///hats/dr1/x.parquet, never
# the /data/hats or the s3://archive/hats it lives in.
#
# [[mount]]
# path = "/hats"               # the address, in both modes
# source = "/data/hats"        # an absolute path, or a url in any scheme read above
# serve = true                 # publish it; off is API-only
# follow_symlinks = false      # a local source only
# catalog_cache_seconds = inf  # in place of [limits] catalog_cache_seconds, for this mount;
#                              # inf for a catalog that never changes once published
# filenames = ["*.parquet"]    # in place of [data] filenames, for this mount
#
# A source in a store. `serve` on one of these puts this service in front of that store: a
# file under `path` is answered by a ranged read against the origin, and a directory by a
# listing. `storage` takes the options a request carries beside its url, with the same
# names, and it is the operator's own credential — a caller reaches the mount by `path`
# and supplies nothing.
#
# [[mount]]
# path = "/archive"
# source = "s3://archive-bucket/hats"
# serve = true
# storage = {endpoint = "https://minio.example.org", region = "us-east-1", access_key_id = "…", secret_access_key = "…"}
#
# [[mount]]
# path = "/staging"
# source = "/srv/staging"
# # no `serve`: readable through the API, not published as a directory

[data]
# Which files are read as data, as glob patterns; both modes consult this list, and a
# [[mount]] may name its own in place of it. Matched against a file's own name, never
# the path above it. The default is what a HATS catalog contains; "_metadata" and
# "_common_metadata" are parquet files with no extension.
#
# Off the list, the file server still serves the bytes and ignores the query parameters;
# the API answers 404.
filenames = ["*.parq", "*.parquet", "*.pq", "_metadata", "_common_metadata"]

# HATS catalogs to publish over IVOA's Table Access Protocol (TAP), for clients such as
# TOPCAT and pyvo, at [api] prefix + /tap. Each entry is one catalog: `name` is the table a
# query names, as FROM {schema}.{table}, and `path` is where the catalog is in this
# service's own url space — a path under a [[mount]], which is what reaches it and what
# carries any credential. TAP is off until at least one is listed.
#
# [[tap.table]]
# name = "gaia_dr3.gaia_source"
# path = "/hats/gaia_dr3"
#
# [[tap.table]]
# name = "ztf.dr24_lc"
# path = "/hats/ztf_dr24_lc"

# Queries to offer against a published table, published at /tap/examples — TOPCAT shows them
# under Examples -> Service Provided, and pyvo returns them from TAPService.examples. The
# default is one cone search per table, written from the catalog; any written here replace it.
#
# [[tap.table.example]]
# name = "Bright stars near M13"
# query = """
# SELECT TOP 10 source_id, ra, dec, phot_g_mean_mag
# FROM gaia_dr3.gaia_source
# WHERE phot_g_mean_mag < 15
#   AND 1 = CONTAINS(POINT(ra, dec), CIRCLE(250.42, 36.46, 0.1))
# """

# What a query submitted to /tap/async may spend. There is no switch for it: TAP requires
# /sync and /async both, so publishing a table publishes a job resource too.
[tap.async]
max_jobs = 256                       # records kept; full refuses a new job with 503
max_running = 2                      # executing at once, the rest wait in QUEUED
max_result_bytes = "1GiB"            # one answer
max_result_bytes_total = "20GiB"     # every held answer; over it the oldest finished job goes
default_execution_seconds = 600      # a job's own clock, which a client may raise…
max_execution_seconds = 3600         # …to here
default_destruction_seconds = 86400  # how long a finished job and its rows are kept…
max_destruction_seconds = 604800     # …at most
max_wait_seconds = 30                # the longest a blocking GET's WAIT may hold

# What a job's query may spend where it should differ from [limits]; absent is the [limits]
# value. This is what async buys — a job is not answering inside one response, so it can
# read partitions a /sync request never could.
#
# [tap.async.limits]
# max_partitions = 100000
# max_rows = 10000000
# max_query_memory_bytes = "2GiB"

[limits]
# A plain HTTP server may ignore a Range request and answer with the whole object. Such
# an object is copied to scratch once and read from local disk after that. Only http(s)
# urls can reach this.

# The most that will be copied for one object. "0" refuses to copy at all.
max_materialize_bytes = "2GiB"
# The same across every copy resident at once.
max_materialize_total_bytes = "8GiB"
# How many copies may be in flight at once. Beyond this a request waits.
max_concurrent_materializations = 4
# Where the copies go, and where a /tap/async job writes its rows. Absent is the system
# temporary directory. A copy is deleted when the request that made it ends, cancelled or
# not; a job's rows when the job is destroyed, and a whole run's when the service stops.
# scratch_dir = "/var/tmp/hats-api"

# The most of a HATS catalog's "dataset/_metadata" that will be fetched to learn its
# partition list. That file holds no rows, so its footer is the whole file, and a wide
# schema over many partitions makes it large. Over this the partitions are listed
# instead — the same partitions, without the per-partition sizes.
max_catalog_metadata_bytes = "256MiB"

# What one request to "/api/v1/hats" may spend. Whichever is reached first refuses it
# with 422, and the body is the plan: the same work as separate requests to fan out over.
#
# Only the partition count is checked before anything is read, so it is the one that
# actually bounds the work; the other two are counters watched as partitions land, and a
# request overshoots them by whatever the reads already in flight go on to fetch.
max_partitions = 128
max_bytes_fetched = "10GiB"
max_rows = 1000000

# How much memory one ADQL statement's own working set may take — a join's hash table, an
# aggregate's groups, a sort's heap. The /adql route's alone: every other route evaluates
# one expression per row, and none of this is what max_rows bounds, since a GROUP BY over a
# million distinct values holds them all while returning one row at a time.
#
# Reached, the query is refused. It does not spill to disk, so this cannot quietly become a
# bound on the scratch space instead. Per request rather than across them.
max_query_memory_bytes = "1GiB"

# How long one request has to produce an answer; over it, 504 and no plan. "0" is no
# bound. Making the answer, not sending it: a mounted file streams for as long as it takes.
max_request_seconds = 90

# How many partitions are read at once. A performance setting rather than a bound: the
# time goes on network latency, so the reads go out together.
max_concurrent_partitions = 4

# How long a generated answer is held for the other requests that read it. "0" turns it
# off. A parquet reader opens one url three times — a size probe, the footer, then the
# data — and without this each of those re-runs the query and re-reads the file.
#
# Deliberately short: the key is the url, and nothing asks the store whether the object has
# changed, so this is also how long a replaced file may still be answered with.
query_cache_seconds = 240
# The most held in such answers at once. One larger than this is never kept, and the oldest
# go when a new one does not fit.
max_query_cache_bytes = "2GiB"

# How long what is read about a catalog — its properties, partitions, schema and the files
# inside its partitions — is kept for the requests after it. "0" keeps nothing, "inf" keeps
# it until evicted for room. Nothing asks the store whether a catalog changed, so this is
# how long a republished catalog may still be answered as it was. A [[mount]] may set its own.
catalog_cache_seconds = 86400
# The most held about catalogs at once, across all of them. The least recently used go
# first when a new one does not fit.
max_catalog_cache_bytes = "256MiB"

# How large a request body may be; over it, 413. "0" is no bound. What makes a body large
# is "region" — a serialized MOC, or one circle per source of a cross-match — and no other
# limit bounds it.
max_request_body_bytes = "2MiB"

# How much SQL one request may carry, in "select" and "where". Both bound the text the
# caller wrote, not how many rows come back.

# How deeply an expression may nest — "((((a = 1))))" is four.
max_expression_depth = 50
# How many terms it may have, which depth does not bound: an IN list is one term wide
# and arbitrarily long.
max_expression_nodes = 50000

[log]
# RUST_LOG syntax, and RUST_LOG itself overrides this when it is set.
filter = "hats_api=info,tower_http=info"
# "text" for one human-readable line per event, "json" for one JSON object per event.
format = "text"
# Colour. Off when the output is not a terminal, whatever this says.
ansi = true
