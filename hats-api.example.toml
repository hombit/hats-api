# Every key is optional and every value shown is the default. An unknown key is a
# startup error.
#
#   hats-api --config hats-api.toml
#   HATS_API_CONFIG=hats-api.toml hats-api

[server]
# Every interface; use "127.0.0.1" to listen locally only.
address = "0.0.0.0"
port = 80
# Say which software and version produced a generated directory page, the way apache
# and nginx sign theirs. Turn it off not to publish which version is running.
show_version = true

[api]
# API mode: the caller names the data in the request, and [api.access] decides what it
# may name. Off serves nothing but the mounts that set `serve`.
enabled = true
# The url subtree the API answers under. It wins over a mount covering the same paths.
prefix = "/api/v1"

[api.access.network]
# Which addresses a request may reach, whatever backend it goes through. A name is
# judged before it is resolved, and every address it resolves to is judged again inside
# the HTTP client's own resolver.

# 127.0.0.0/8, ::1, localhost.
allow_loopback = false
# RFC1918, unique-local, and link-local — cloud instance metadata.
allow_private = false
# Names that only mean something inside a network. A name must end in a TLD IANA has
# delegated; .internal, .local, .lan and single-label names are refused.
allow_local_names = false
# Allowed whatever the three switches say. A host named here is allowed along with
# whatever it resolves to.
# allow_cidrs = ["10.1.2.0/24"]
# allow_hosts = ["minio.internal"]

# Each [api.access.<backend>] below has three states: no `endpoints` key for any
# endpoint (the default, still subject to [api.access.network]), an empty list to turn
# the scheme off, or a list for exactly those. Naming an endpoint is permission on its
# own — [api.access.network] is not consulted for it. Any bucket at an allowed endpoint
# is readable.

[api.access.s3]
# "aws" is S3 itself — a url with no `endpoint` option. Anything else is a url.
# endpoints = ["aws", "https://minio.example.com"]

[api.access.gcs]
# "gcp" is Google Cloud Storage itself.
# endpoints = ["gcp"]

[api.access.azure]
# "azure" is Azure Blob Storage itself; a named endpoint is Azurite or a compatible.
# endpoints = ["azure"]

[api.access.http]
# For http:// and https:// urls. Every entry is a url; there is no provider name here.
# endpoints = ["https://data.example.com"]

# Whether an http:// url may be read when no endpoint list names one. A request carrying
# a credential also needs its own `allow_http` option. Naming an http:// server in
# `endpoints` does not need this as well.
allow_plain_http = false

[api.access.webdav]
# For webdav:// urls, written with the transport underneath rather than "webdav://". A
# request picks the transport with a `transport` option, "https" (the default) or
# "http"; there is no allow_plain_http here, so cleartext WebDAV is reached only by
# naming the "http://" server.
# endpoints = ["https://dav.example.com"]

# There is no [api.access] section for local files: a [[mount]] is what makes a
# directory readable.

# Zero or more mounts, each naming one local directory. `path` and `source` are required,
# and two mounts may not claim the same subtree, served or not.
#
# `path` is the address in both modes. The file server publishes the directory there, and
# an API request names a file in it by the same path: file:///hats/dr1/x.parquet, never
# the /data/hats it lives in.
#
# [[mount]]
# path = "/hats"               # the address, in both modes
# source = "/data/hats"        # an absolute path or a file:// url, and a directory
# serve = true                 # publish it; off is API-only
# follow_symlinks = false      # per mount
# immutable = false            # never changes once published, so a cached copy needs no
#                              # revalidating
# filenames = ["*.parquet"]    # in place of [data] filenames, for this mount
#
# [[mount]]
# path = "/staging"
# source = "/srv/staging"
# # no `serve`: readable through the API, not published as a directory

[data]
# Which files are read as data, as glob patterns; both modes consult this list, and a
# [[mount]] may name its own in place of it. Matched against a file's own name, never
# the path above it. The default is what a HATS catalog contains; "_metadata" and
# "_common_metadata" are parquet files with no extension.
#
# Off the list, the file server still serves the bytes and ignores the query parameters;
# the API answers 404.
filenames = ["*.parq", "*.parquet", "*.pq", "_metadata", "_common_metadata"]

[limits]
# A plain HTTP server may ignore a Range request and answer with the whole object. Such
# an object is copied to scratch once and read from local disk after that. Only http(s)
# urls can reach this.

# The most that will be copied for one object. "0" refuses to copy at all.
max_materialize_bytes = "2GiB"
# The same across every copy resident at once.
max_materialize_total_bytes = "8GiB"
# How many copies may be in flight at once. Beyond this a request waits.
max_concurrent_materializations = 4
# Where the copies go. Absent is the system temporary directory. Each is deleted when
# the request that made it ends, cancelled or not.
# scratch_dir = "/var/tmp/hats-api"

# The most of a HATS catalog's "dataset/_metadata" that will be fetched to learn its
# partition list. That file holds no rows, so its footer is the whole file, and a wide
# schema over many partitions makes it large. Over this the partitions are listed
# instead — the same partitions, without the per-partition sizes.
max_catalog_metadata_bytes = "256MiB"

# How many partitions of a catalog one request to "/api/v1/hats" may read. Over this it
# is refused with 413. A count rather than a size: the partition list says how many there
# are without a second request, and how large they are comes only from "_metadata".
max_partitions = 2000

# How much SQL one request may carry, in "select" and "where". Both bound the text the
# caller wrote, not how many rows come back.

# How deeply an expression may nest — "((((a = 1))))" is four.
max_expression_depth = 50
# How many terms it may have, which depth does not bound: an IN list is one term wide
# and arbitrarily long.
max_expression_nodes = 50000

[log]
# RUST_LOG syntax, and RUST_LOG itself overrides this when it is set.
filter = "hats_api=info,tower_http=info"
# "text" for one human-readable line per event, "json" for one JSON object per event.
format = "text"
# Colour. Off when the output is not a terminal, whatever this says.
ansi = true
