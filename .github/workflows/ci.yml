name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the first one's run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A backtrace on a failing test is the difference between one CI round trip and
  # three.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Everything here is hermetic: the S3 and WebDAV tests run against in-process
      # servers, and `tests/s3_remote.rs` and `tests/webdav_real.rs` skip because no
      # target is configured in this job. Nothing in this workflow reaches the network
      # or needs a credential, so it runs on pull requests from forks.
      - name: cargo test
        run: cargo test --all-targets

      - name: cargo doc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  # A real MinIO, which is what the deployments this serves actually run. No secret is
  # involved — the container's credentials are made up here and it is destroyed with
  # the runner — so this runs on pull requests, forks included.
  #
  # `docker run` rather than a service container: the MinIO image needs `server /data`
  # as its command, and `jobs.<id>.services` has no way to set one.
  minio:
    name: real MinIO
    runs-on: ubuntu-latest
    env:
      HATS_API_TEST_MINIO_ENDPOINT: http://127.0.0.1:9000
      HATS_API_TEST_MINIO_ACCESS_KEY: minioadmin
      HATS_API_TEST_MINIO_SECRET_KEY: minioadmin
      HATS_API_TEST_MINIO_BUCKET: hats-test
      # Without this the tests would skip, and a job that skipped everything would
      # still be green.
      HATS_API_TEST_REQUIRE_REMOTE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$HATS_API_TEST_MINIO_ACCESS_KEY \
            -e MINIO_ROOT_PASSWORD=$HATS_API_TEST_MINIO_SECRET_KEY \
            quay.io/minio/minio server /data

      # The tests write their own fixtures, but S3 has no way to create a bucket
      # implicitly, so that one step is here.
      - name: wait for MinIO and create the bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ env.HATS_API_TEST_MINIO_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.HATS_API_TEST_MINIO_SECRET_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS "$HATS_API_TEST_MINIO_ENDPOINT/minio/health/live" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "$HATS_API_TEST_MINIO_ENDPOINT/minio/health/live" >/dev/null \
            || { echo "MinIO did not come up"; docker logs minio; exit 1; }
          aws --endpoint-url "$HATS_API_TEST_MINIO_ENDPOINT" \
            s3 mb "s3://$HATS_API_TEST_MINIO_BUCKET"

      - name: cargo test --test s3_minio
        run: cargo test --test s3_minio

      - name: MinIO logs
        if: failure()
        run: docker logs minio

  # A real WebDAV server, for the same reason the MinIO job exists: an object's size
  # arrives as a PROPFIND XML body, and servers disagree about namespace prefixes, href
  # spelling and which properties they return at all. The in-process server in
  # `tests/webdav.rs` can only prove OpenDAL parses the XML this repository writes.
  #
  # `rclone serve webdav` rather than a container: it is a real implementation, it is one
  # binary, and there is nothing to pull or wait for. The credentials are made up here
  # and the server is destroyed with the runner, so this runs on forks too.
  webdav:
    name: real WebDAV
    runs-on: ubuntu-latest
    env:
      HATS_API_TEST_WEBDAV_ENDPOINT: http://127.0.0.1:8788
      HATS_API_TEST_WEBDAV_USERNAME: hats
      HATS_API_TEST_WEBDAV_PASSWORD: hats-test
      # Without this the tests would skip, and a job that skipped everything would
      # still be green.
      HATS_API_TEST_REQUIRE_REMOTE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: start a WebDAV server
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p /tmp/davroot
          rclone serve webdav --addr 127.0.0.1:8788 \
            --user "$HATS_API_TEST_WEBDAV_USERNAME" \
            --pass "$HATS_API_TEST_WEBDAV_PASSWORD" \
            /tmp/davroot > /tmp/rclone.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -u "$HATS_API_TEST_WEBDAV_USERNAME:$HATS_API_TEST_WEBDAV_PASSWORD" \
                 "$HATS_API_TEST_WEBDAV_ENDPOINT/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "the WebDAV server did not come up"; cat /tmp/rclone.log; exit 1

      - name: cargo test --test webdav_real
        run: cargo test --test webdav_real

      - name: WebDAV server logs
        if: failure()
        run: cat /tmp/rclone.log

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
