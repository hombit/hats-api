name: S3 against public deployments

# Not on pull requests: a failure here usually means something changed on the outside
# rather than something a commit did.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Without this a job whose configuration went missing would skip every test and
  # still be green.
  HATS_API_TEST_REQUIRE_REMOTE: "1"
  # In parallel these invite throttling that looks like a test failure.
  RUST_TEST_THREADS: "1"

jobs:
  aws:
    name: public AWS bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false

      - name: read a public HATS partition
        run: cargo test --test s3_remote -- aws
        env:
          HATS_API_TEST_AWS: "1"

  snad:
    name: SNAD public bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false

      - name: read from the SNAD deployment
        run: cargo test --test s3_remote -- snad
        env:
          HATS_API_TEST_SNAD: "1"
