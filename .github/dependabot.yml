version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types: [patch]
      # These move together or not at all. `reqwest` and the transport adapter are in
      # here for the same reason `object_store` is: `network` builds the client that
      # OpenDAL then uses.
      datafusion-stack:
        patterns:
          - datafusion
          - object_store
          - object_store_opendal
          - opendal
          - opendal-http-transport-reqwest
          - reqwest
      test-only:
        dependency-type: development
        patterns:
          - "*"
    labels: [dependencies]

  - package-ecosystem: uv
    directory: /tap-conformance
    schedule:
      interval: monthly
    groups:
      conformance-clients:
        patterns:
          - "*"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns:
          - "*"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels: [dependencies]
