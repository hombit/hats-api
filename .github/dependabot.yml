version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types: [patch]
      test-only:
        dependency-type: development
        patterns:
          - "*"
    # Bumped by hand with DataFusion: raised alone, any of these doubles `object_store`.
    ignore:
      - dependency-name: object_store
      - dependency-name: object_store_opendal
      - dependency-name: opendal
      - dependency-name: opendal-http-transport-reqwest
      - dependency-name: reqwest
    labels: [dependencies]

  - package-ecosystem: uv
    directory: /tap-conformance
    schedule:
      interval: monthly
    groups:
      conformance-clients:
        patterns:
          - "*"
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns:
          - "*"
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels: [dependencies]
