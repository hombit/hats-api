# `pre-commit install` once; `pre-commit run --all-files` to sweep the tree.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.9
    hooks:
      - id: biome-check

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: >-
          bash -c 'cargo clippy --all-targets --fix --allow-staged --allow-dirty
          && cargo clippy --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets
        language: system
        types: [rust]
        pass_filenames: false

# pre-commit.ci has no Rust: https://github.com/pre-commit-ci/issues/issues/89
# The cargo hooks run locally and in the CI workflow instead.
ci:
  skip: [cargo-fmt, cargo-clippy, cargo-test]
