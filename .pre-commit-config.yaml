# `pre-commit install` once; `pre-commit run --all-files` to sweep the tree.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: mixed-line-ending
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: local
    hooks:
      # The plan is scaffolding and gets deleted when the work in it is done, so a
      # reference to it from anywhere else becomes a dangling pointer that day. CLAUDE.md
      # is exempt because it is where the rule is written down.
      - id: no-plan-references
        name: nothing refers to the development plan
        entry: >-
          bash -c 'git grep -nIE "DEVELOPMENT_PLAN|§[0-9]" --
          ":!DEVELOPMENT_PLAN.md" ":!CLAUDE.md" ":!.pre-commit-config.yaml"
          && { echo "^ the plan gets deleted; say the reason instead of pointing at it";
          exit 1; } || true'
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      # --fix applies what it can; the second pass fails on the rest.
      - id: cargo-clippy
        name: cargo clippy
        entry: >-
          bash -c 'cargo clippy --all-targets --fix --allow-staged --allow-dirty
          && cargo clippy --all-targets -- -D warnings'
        language: system
        types: [rust]
        pass_filenames: false

      # Kept here only while the suite stays fast (~2s).
      - id: cargo-test
        name: cargo test
        entry: cargo test --all-targets
        language: system
        types: [rust]
        pass_filenames: false

# pre-commit.ci has no Rust: https://github.com/pre-commit-ci/issues/issues/89
# The cargo hooks run locally and in the CI workflow instead.
ci:
  skip: [cargo-fmt, cargo-clippy, cargo-test]
